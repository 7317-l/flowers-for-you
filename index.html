<title>梦幻烟花秀 · 花朵绽放</title>

  /* ========== 全局重置与基础样式 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Georgia", "Songti SC", "SimSun", serif;
    cursor: crosshair;
  }

  /* 画布全屏覆盖 */

    display: block;
    width: 100vw;
    height: 100vh;

      #070a1f 35%,
      #03040f 65%,
      #000000 100%);
  }

  /* 操作提示 —— 优雅淡入后常驻角落 */
  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 240, 220, 0.45);
    font-size: 13px;
    letter-spacing: 3px;
    text-align: center;
    pointer-events: none;
    animation: hintFade 3s ease-in-out infinite;

    text-shadow: 0 0 12px rgba(255, 200, 150, 0.3);

    pointer-events: none;

<script>

  petalChance: 0.45,         // 烟花散落花瓣的概率
  petalCountMin: 3,          // 最少散落花瓣数
  petalCountMax: 8,          // 最多散落花瓣数

  flowerBloomTime: 100,      // 花朵绽放总时长（帧）
  flowerHoldTime: 280,       // 花朵盛开停留时长（帧）
  flowerFadeTime: 140,       // 花朵淡出时长（帧）
  flowerSizeMin: 40,         // 花朵最小尺寸

  flowerCenterRangeY: 0.18,  // 花朵垂直分布范围（中心±比例）

  petalShadowBlur: 8,        // 花瓣阴影模糊（立体感）
  petalShadowAlpha: 0.35,    // 花瓣阴影透明度
  petal3DTilt: 0.15,         // 花瓣3D倾斜幅度（透视压缩）

  // ---- 花朵环绕粒子 ----
  orbitParticleCount: 16,    // 每朵花的环绕粒子数
  orbitRadiusMin: 1.1,       // 轨道最小半径（花朵尺寸倍数，确保粒子在花朵外围不进中心）
  orbitRadiusMax: 1.7,       // 轨道最大半径（花朵尺寸倍数）
  orbitSpeedMin: 0.008,      // 最慢公转角速度
  orbitSpeedMax: 0.025,      // 最快公转角速度
  orbitParticleSize: 1.8,    // 环绕粒子半径
  orbitGlow: 7,              // 环绕粒子辉光（径向渐变）

  // ---- 鼠标交互 ----
  clickSparkCount: 45,       // 点击烟花粒子数
  clickPetalCount: 4,        // 点击伴随花瓣数

/* ---- 烟花配色：暖金/玫瑰粉/香槟橙/宝石红 + 大量蓝绿冷色系 ---- */
const FIREWORK_COLORS = [
  // 暖色系（4种）
  { core: '#FFFFFF', mid: '#FFD700', edge: '#FFA500' },  // 暖金
  { core: '#FFFFFF', mid: '#FF6B9D', edge: '#E63946' },  // 玫瑰粉
  { core: '#FFFFFF', mid: '#FFB347', edge: '#FF8C42' },  // 香槟橙
  { core: '#FFFFFF', mid: '#E63946', edge: '#B71C1C' },  // 宝石红
  // 蓝色系（4种）
  { core: '#FFFFFF', mid: '#A8D8EA', edge: '#5DADE2' },  // 冰蓝
  { core: '#FFFFFF', mid: '#54A0FF', edge: '#2E86DE' },  // 天蓝
  { core: '#FFFFFF', mid: '#3498DB', edge: '#1B4F72' },  // 宝蓝
  { core: '#FFFFFF', mid: '#74B9FF', edge: '#0984E3' },  // 青蓝
  // 绿色系（4种）
  { core: '#FFFFFF', mid: '#55EFC4', edge: '#00B894' },  // 薄荷绿
  { core: '#FFFFFF', mid: '#2ECC71', edge: '#1E8449' },  // 翠绿
  { core: '#FFFFFF', mid: '#00CEC9', edge: '#008B8B' },  // 青绿
  { core: '#FFFFFF', mid: '#81ECEC', edge: '#00ABB3' },  // 湖绿
  // 紫色系（1种）
  { core: '#FFFFFF', mid: '#B388EB', edge: '#7C4DFF' },  // 薰衣草紫
];

/* 烟花配色分组，用于按比例抽取 */
const FW_WARM = FIREWORK_COLORS.slice(0, 4);
const FW_BLUE = FIREWORK_COLORS.slice(4, 8);
const FW_GREEN = FIREWORK_COLORS.slice(8, 12);
const FW_PURPLE = FIREWORK_COLORS.slice(12, 13);

/* ---- 花朵配色：淡蓝、淡黄、淡青、淡紫、淡粉 ---- */
const FLOWER_COLORS = [
  { petal: '#B0E0E6', petalEdge: '#87CEEB', center: '#6BB3D9' },  // 淡蓝
  { petal: '#FFFACD', petalEdge: '#F0E68C', center: '#E6D56B' },  // 淡黄
  { petal: '#AFEEEE', petalEdge: '#7FDBDA', center: '#5CC4C2' },  // 淡青
  { petal: '#E6E6FA', petalEdge: '#D8BFD8', center: '#B8A5D6' },  // 淡紫
  { petal: '#FFC0CB', petalEdge: '#FFA0B4', center: '#F08DA3' },  // 淡粉
];

/* ---- 花瓣飘落配色（与花朵色系一致） ---- */
const FALLING_PETAL_COLORS = [
  '#B0E0E6', '#FFFACD', '#AFEEEE', '#E6E6FA', '#FFC0CB', '#87CEEB'
];

/* ========================================================================
   ★ 工具函数
   ======================================================================== */

/** 在 [min, max] 区间取随机浮点数 */
function rand(min, max) { return Math.random() * (max - min) + min; }

/** 在 [min, max] 区间取随机整数 */
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

/** 从数组中随机取一个元素 */
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/** 三次缓出：开始快、结束慢，适合自然运动 */
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

/** 弹性缓出：带有轻微过冲和回弹，适合花瓣绽放 */
function easeOutElastic(t) {
  if (t === 0 || t === 1) return t;
  const c4 = (2 * Math.PI) / 3;
  return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
}

/** 二次缓入缓出：平滑的加速减速，适合整体过渡 */
function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

/** 将十六进制颜色转为 rgba 字符串，支持透明度 */
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/** 在两种十六进制颜色之间插值，t ∈ [0,1] */
function lerpColor(hex1, hex2, t) {
  const r1 = parseInt(hex1.slice(1, 3), 16), g1 = parseInt(hex1.slice(3, 5), 16), b1 = parseInt(hex1.slice(5, 7), 16);
  const r2 = parseInt(hex2.slice(1, 3), 16), g2 = parseInt(hex2.slice(3, 5), 16), b2 = parseInt(hex2.slice(5, 7), 16);
  const r = Math.round(r1 + (r2 - r1) * t);
  const g = Math.round(g1 + (g2 - g1) * t);
  const b = Math.round(b1 + (b2 - b1) * t);
  return `rgb(${r},${g},${b})`;
}

/* ========================================================================
   ★ Particle 类 —— 通用粒子（烟花拖尾、爆炸火花、闪光、鼠标拖尾）
   ======================================================================== */

class Particle {
  constructor() { this.reset(0, 0, 0, 0, '#FFF', 1, 1); }

  /**
   * 重置粒子参数（对象池复用）
   * @param {number} x, y - 初始位置
   * @param {number} vx, vy - 初始速度
   * @param {string} color - 十六进制颜色
   * @param {number} life - 寿命（帧）
   * @param {number} size - 半径
   */
  reset(x, y, vx, vy, color, life, size) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.color = color;
    this.life = life;
    this.maxLife = life;
    this.size = size;
    this.gravity = 0;
    this.friction = 1;
    this.glow = 0;
    this.twinkle = false;
    this.twinklePhase = rand(0, Math.PI * 2);
    this.type = 'spark'; // spark | trail | flash | mousetrail
    this.active = true;
  }

  update() {
    if (!this.active) return;
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    if (this.life <= 0) this.active = false;
  }

  draw(ctx) {
    if (!this.active) return;
    const lifeRatio = this.life / this.maxLife;

    // 闪烁效果
    let alpha = lifeRatio;
    if (this.twinkle) {
      alpha *= 0.5 + 0.5 * Math.sin(this.twinklePhase + this.life * 0.15);
    }
    alpha = Math.max(0, alpha);

    // 闪光类型：径向渐变快速衰减（无需shadowBlur）
    if (this.type === 'flash') {
      const flashAlpha = lifeRatio * 0.6;
      const r = this.size * lifeRatio;
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
      grad.addColorStop(0, `rgba(255,255,255,${flashAlpha})`);
      grad.addColorStop(0.3, hexToRgba(this.color, flashAlpha * 0.5));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
      ctx.fill();
      return;
    }

    const radius = this.size * (0.6 + 0.4 * lifeRatio);

    // 用径向渐变模拟辉光，替代昂贵的shadowBlur（性能提升5-10倍）
    if (this.glow > 0) {
      const glowR = radius + this.glow * 0.6;
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowR);
      grad.addColorStop(0, hexToRgba(this.color, alpha));
      grad.addColorStop(0.35, hexToRgba(this.color, alpha * 0.5));
      grad.addColorStop(1, hexToRgba(this.color, 0));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, glowR, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // 无辉光粒子：普通圆点
      ctx.fillStyle = hexToRgba(this.color, alpha);
      ctx.beginPath();
      ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

/* ========================================================================
   ★ FallingPetal 类 —— 从烟花散落的飘落花瓣
   ======================================================================== */

class FallingPetal {
  constructor() { this.active = false; }

  reset(x, y, color) {
    this.x = x; this.y = y;
    this.vx = rand(-0.8, 0.8);
    this.vy = rand(0.3, CONFIG.petalFallSpeed);
    this.color = color;
    this.life = CONFIG.petalLife;
    this.maxLife = CONFIG.petalLife;
    this.size = rand(CONFIG.petalSize * 0.7, CONFIG.petalSize * 1.3);
    this.rotation = rand(0, Math.PI * 2);
    this.rotSpeed = rand(-0.03, 0.03);
    this.swayPhase = rand(0, Math.PI * 2);
    this.active = true;
  }

  update() {
    if (!this.active) return;
    this.swayPhase += CONFIG.petalSway;
    this.x += this.vx + Math.sin(this.swayPhase) * 0.5;
    this.y += this.vy;
    this.vy += 0.005; // 轻微重力加速
    this.rotation += this.rotSpeed;
    this.life--;
    if (this.life <= 0) this.active = false;
  }

  draw(ctx) {
    if (!this.active) return;
    const lifeRatio = this.life / this.maxLife;
    // 淡出阶段在后半段开始
    const alpha = lifeRatio > 0.4 ? 1 : lifeRatio / 0.4;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.globalAlpha = alpha * 0.85;

    // 绘制单片花瓣（贝塞尔曲线，细长椭圆）
    ctx.beginPath();
    ctx.moveTo(0, -this.size * 0.5);
    ctx.bezierCurveTo(
      this.size * 0.5, -this.size * 0.3,
      this.size * 0.4, this.size * 0.4,
      0, this.size * 0.5
    );
    ctx.bezierCurveTo(
      -this.size * 0.4, this.size * 0.4,
      -this.size * 0.5, -this.size * 0.3,
      0, -this.size * 0.5
    );
    ctx.fillStyle = this.color;
    ctx.fill();

    // 花瓣高光（半透明纵向条纹）
    ctx.globalAlpha = alpha * 0.3;
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, -this.size * 0.4);
    ctx.quadraticCurveTo(this.size * 0.1, 0, 0, this.size * 0.4);
    ctx.stroke();

    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

/* ========================================================================
   ★ Firework 类 —— 烟花火箭（上升 → 爆炸）
   ======================================================================== */

class Firework {
  constructor() { this.active = false; }

  /**
   * 发射一枚烟花
   * @param {number} startX - 起始x坐标（底部）
   * @param {number} targetY - 目标爆炸高度y
   * @param {object} colorSet - 配色方案 {core, mid, edge}
   * @param {boolean} small - 是否为小型（点击触发）
   */
  launch(startX, targetY, colorSet, small = false) {
    this.x = startX;
    this.y = H + 10;  // 从屏幕底部下方升起（使用CSS像素坐标）
    this.targetY = targetY;
    this.colorSet = colorSet;
    this.small = small;
    // 初速度：根据目标高度计算，确保能到达目标位置
    this.vy = -CONFIG.rocketSpeed * (small ? 0.7 : 1);
    this.vx = rand(-0.5, 0.5);
    this.exploded = false;
    this.active = true;
    this.trailTimer = 0;
  }

  update(particles) {
    if (!this.active) return;

    // 上升阶段
    if (!this.exploded) {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += CONFIG.rocketGravity;

      // 生成拖尾粒子
      this.trailTimer++;
      if (this.trailTimer >= 1) {
        this.trailTimer = 0;
        for (let i = 0; i < CONFIG.rocketTrailRate; i++) {
          const p = getParticle();
          if (p) {
            p.reset(
              this.x + rand(-1, 1), this.y + rand(0, 4),
              rand(-0.3, 0.3), rand(0.5, 1.5),
              this.colorSet.mid,
              CONFIG.rocketTrailLife,
              rand(1, 2)
            );
            p.type = 'trail';
            p.gravity = 0.02;
            p.friction = 0.96;
          }
        }
      }

      // 到达目标高度或速度减为零时爆炸
      if (this.y <= this.targetY || this.vy >= -0.5) {
        this.explode(particles);
      }
    }
  }

  /** 爆炸：生成放射状粒子群 */
  explode(particles) {
    this.exploded = true;
    this.active = false;

    const count = this.small
      ? CONFIG.clickSparkCount
      : randInt(CONFIG.sparkCountMin, CONFIG.sparkCountMax);

    // 中心闪光
    const flash = getParticle();
    if (flash) {
      flash.reset(this.x, this.y, 0, 0, this.colorSet.mid, CONFIG.flashLife, CONFIG.flashRadius);
      flash.type = 'flash';
    }

    // 爆炸粒子 —— 均匀放射状分布（球形/菊花形）
    for (let i = 0; i < count; i++) {
      const p = getParticle();
      if (!p) break;

      // 均匀角度 + 随机速度，形成饱满的球形
      const angle = (Math.PI * 2 * i) / count + rand(-0.05, 0.05);
      const speed = rand(CONFIG.sparkSpeedMin, CONFIG.sparkSpeedMax) * (this.small ? 0.6 : 1);

      // 颜色：大部分用 mid 色，少量用 edge 色增加层次
      const useEdge = Math.random() < 0.3;
      const color = useEdge ? this.colorSet.edge : this.colorSet.mid;

      p.reset(
        this.x, this.y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        color,
        randInt(CONFIG.sparkLifeMin, CONFIG.sparkLifeMax),
        rand(CONFIG.sparkSizeMin, CONFIG.sparkSizeMax)
      );
      p.gravity = CONFIG.sparkGravity;
      p.friction = CONFIG.sparkFriction;
      p.glow = CONFIG.sparkGlow;
      p.twinkle = Math.random() < CONFIG.sparkTwinkleChance;
      p.type = 'spark';
    }

    // 散落花瓣（诗意惊喜）
    const petalCount = this.small
      ? CONFIG.clickPetalCount
      : (Math.random() < CONFIG.petalChance ? randInt(CONFIG.petalCountMin, CONFIG.petalCountMax) : 0);

    for (let i = 0; i < petalCount; i++) {
      const fp = getFallingPetal();
      if (fp) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(0.5, 2);
        fp.reset(
          this.x + Math.cos(angle) * 10,
          this.y + Math.sin(angle) * 10,
          pick(FALLING_PETAL_COLORS)
        );
        fp.vx = Math.cos(angle) * speed;
        fp.vy = Math.sin(angle) * speed * 0.5 + 0.5;
      }
    }
  }

  draw(ctx) {
    if (!this.active || this.exploded) return;
    // 火箭头部：径向渐变辉光（替代shadowBlur）
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 8);
    grad.addColorStop(0, this.colorSet.core);
    grad.addColorStop(0.3, hexToRgba(this.colorSet.core, 0.8));
    grad.addColorStop(0.6, hexToRgba(this.colorSet.mid, 0.4));
    grad.addColorStop(1, hexToRgba(this.colorSet.mid, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ========================================================================
   ★ Flower 类 —— 绽放的花朵（玫瑰 / 樱花 / 雏菊）
   *  使用贝塞尔曲线绘制花瓣，逐层舒展，带弹性回弹
   ======================================================================== */

class Flower {
  constructor() { this.active = false; }

  /**
   * 在指定位置绽放一朵花
   * @param {number} x, y - 花朵中心坐标
   * @param {string} type - 'rose' | 'sakura' | 'daisy'
   * @param {object} colorSet - 配色 {petal, petalEdge, center}
   * @param {number} size - 花朵尺寸（半径基准）
   */
  bloom(x, y, type, colorSet, size) {
    this.x = x;
    this.y = y;
    this.type = type;
    this.colorSet = colorSet;
    this.size = size;
    this.age = 0;
    this.active = true;

    // 总生命周期 = 绽放 + 停留 + 淡出
    this.totalLife = CONFIG.flowerBloomTime + CONFIG.flowerHoldTime + CONFIG.flowerFadeTime;

    // 根据花型初始化花瓣配置
    this.petals = this.createPetals();

    // 初始化环绕粒子：椭圆轨道，不同速度/相位/半径
    this.orbitParticles = [];
    for (let i = 0; i < CONFIG.orbitParticleCount; i++) {
      this.orbitParticles.push({
        angle: rand(0, Math.PI * 2),
        radius: this.size * rand(CONFIG.orbitRadiusMin, CONFIG.orbitRadiusMax),
        speed: rand(CONFIG.orbitSpeedMin, CONFIG.orbitSpeedMax) * (Math.random() < 0.3 ? -1 : 1),
        eccentricity: rand(0.5, 1.0), // 椭圆离心率（0=圆，1=扁）
        size: rand(CONFIG.orbitParticleSize * 0.6, CONFIG.orbitParticleSize * 1.3),
        phase: rand(0, Math.PI * 2),
        twinkleSpeed: rand(0.05, 0.12),
      });
    }
  }

  /** 根据花型创建花瓣参数列表 */
  createPetals() {
    const petals = [];
    if (this.type === 'rose') {
      // 玫瑰：3~4层花瓣，每层数量递增，层间旋转偏移
      const layers = randInt(3, 4);
      for (let layer = 0; layer < layers; layer++) {
        const count = 5 + layer * 2;           // 每层花瓣数
        const layerScale = 0.4 + layer * 0.25; // 越外层越大
        const rotOffset = layer * 0.3;         // 层间旋转偏移，营造螺旋感
        const delay = layer * 12;              // 外层延迟绽放
        for (let i = 0; i < count; i++) {
          petals.push({
            angle: (Math.PI * 2 * i) / count + rotOffset,
            length: this.size * layerScale * rand(0.85, 1.1),
            width: this.size * layerScale * 0.55 * rand(0.9, 1.1),
            delay: delay + rand(0, 6),
            layer: layer,
          });
        }
      }
    } else if (this.type === 'sakura') {
      // 樱花：5片花瓣，花瓣尖端有凹缺
      for (let i = 0; i < 5; i++) {
        petals.push({
          angle: (Math.PI * 2 * i) / 5 - Math.PI / 2,
          length: this.size * rand(0.9, 1.1),
          width: this.size * 0.65 * rand(0.9, 1.1),
          delay: rand(0, 8),
          notch: true, // 尖端凹缺
        });
      }
    } else {
      // 雏菊：12~16片细长花瓣，分两层交错
      const count = randInt(12, 16);
      for (let layer = 0; layer < 2; layer++) {
        for (let i = 0; i < count; i++) {
          petals.push({
            angle: (Math.PI * 2 * i) / count + layer * (Math.PI / count),
            length: this.size * (layer === 0 ? 1 : 0.75) * rand(0.95, 1.05),
            width: this.size * 0.2 * rand(0.9, 1.1), // 细长
            delay: layer * 8 + rand(0, 5),
          });
        }
      }
    }
    return petals;
  }

  update() {
    if (!this.active) return;
    this.age++;
    if (this.age >= this.totalLife) this.active = false;
    // 更新环绕粒子角度
    if (this.orbitParticles) {
      for (const op of this.orbitParticles) {
        op.angle += op.speed;
      }
    }
  }

  /** 计算单瓣花瓣的绽放进度（带延迟和弹性） */
  petalProgress(petal) {
    const effectiveAge = this.age - petal.delay;
    if (effectiveAge <= 0) return 0;
    const t = Math.min(effectiveAge / (CONFIG.flowerBloomTime * 0.7), 1);
    return easeOutElastic(t);
  }

  /** 计算整朵花的透明度（柔和淡入 / 呼吸停留 / 温柔淡出） */
  getAlpha() {
    // 淡入阶段：easeOutCubic 从透明到完全显现
    if (this.age < CONFIG.flowerBloomTime) {
      return easeOutCubic(this.age / CONFIG.flowerBloomTime);
    }
    const fadeStart = CONFIG.flowerBloomTime + CONFIG.flowerHoldTime;
    // 淡出阶段：easeInOutQuad 温柔消失
    if (this.age > fadeStart) {
      const t = (this.age - fadeStart) / CONFIG.flowerFadeTime;
      return Math.max(0, 1 - easeInOutQuad(t));
    }
    // 停留阶段：微妙的呼吸效果（±6%透明度波动），仿佛花朵在呼吸
    const holdAge = this.age - CONFIG.flowerBloomTime;
    return 0.94 + 0.06 * Math.sin(holdAge * 0.03);
  }

  draw(ctx) {
    if (!this.active) return;
    const alpha = this.getAlpha();
    if (alpha <= 0) return;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalAlpha = alpha;

    // ---- 第一层：环绕粒子的后半圈（在花朵后方，营造3D包裹感）----
    this.drawOrbitParticles(ctx, true);

    // ---- 第二层：花瓣（从外层到内层，内层覆盖在外层上方）----
    const sorted = [...this.petals].sort((a, b) => (b.layer || 0) - (a.layer || 0));

    for (const petal of sorted) {
      const progress = this.petalProgress(petal);
      if (progress <= 0) continue;

      ctx.save();
      ctx.rotate(petal.angle);

      // 花瓣从花心向外舒展：闭合时指向中心（旋转-90°），开放时平展
      const openRotation = -Math.PI / 2 + (Math.PI / 2) * progress;
      ctx.rotate(openRotation);

      // 3D透视：花瓣宽度随开放程度轻微压缩，模拟立体翻折
      const tiltScale = 1 - CONFIG.petal3DTilt * (1 - progress);
      ctx.scale(tiltScale, 1);

      const petalLength = petal.length * progress;
      const petalWidth = petal.width * (0.3 + 0.7 * progress);

      this.drawPetal(ctx, petalLength, petalWidth, petal);
      ctx.restore();
    }

    // ---- 第三层：花蕊（凸起于花瓣之上）----
    this.drawCenter(ctx);

    // ---- 第四层：环绕粒子的前半圈（在花朵前方，完成3D环绕）----
    this.drawOrbitParticles(ctx, false);

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /** 绘制单片花瓣 —— 径向渐变主体 + 简洁高光（无shadowBlur/clip，高性能） */
  drawPetal(ctx, length, width, petal) {
    const { petal: baseColor, petalEdge } = this.colorSet;
    const layer = petal.layer || 0;
    const layerDarken = 1 - layer * 0.12;
    const layerAlpha = 0.75 + layer * 0.08;

    // ---- 花瓣主体：径向渐变模拟光照（基部暗→中部亮→尖端微暗）----
    const grad = ctx.createRadialGradient(0, -length * 0.1, 0, 0, -length * 0.4, length);
    grad.addColorStop(0, hexToRgba(this.darkenColor(petalEdge, layerDarken), layerAlpha));
    grad.addColorStop(0.4, hexToRgba(this.darkenColor(baseColor, layerDarken), layerAlpha + 0.1));
    grad.addColorStop(0.75, hexToRgba(baseColor, layerAlpha - 0.05));
    grad.addColorStop(1, hexToRgba(petalEdge, layerAlpha - 0.25));

    ctx.fillStyle = grad;
    ctx.beginPath();
    this.petalPath(ctx, length, width, petal);
    ctx.fill();

    // ---- 花瓣左侧受光面：用半透明白色贝塞尔曲线代替clip（性能友好）----
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
    ctx.lineWidth = width * 0.25;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -length * 0.08);
    ctx.quadraticCurveTo(-width * 0.35, -length * 0.4, -width * 0.15, -length * 0.85);
    ctx.stroke();

    // ---- 花瓣边缘透光描边 ----
    ctx.strokeStyle = hexToRgba('#FFFFFF', 0.15);
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    this.petalPath(ctx, length, width, petal);
    ctx.stroke();

    // ---- 单条主脉络（去掉3条，减少绘制调用）----
    ctx.strokeStyle = hexToRgba(petalEdge, 0.15);
    ctx.lineWidth = 0.35;
    ctx.beginPath();
    ctx.moveTo(0, -length * 0.05);
    ctx.quadraticCurveTo(width * 0.03, -length * 0.45, 0, -length * 0.85);
    ctx.stroke();
  }

  /** 花瓣路径（复用，避免重复代码） */
  petalPath(ctx, length, width, petal) {
    if (petal.notch) {
      // 樱花花瓣：尖端有凹缺
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(width * 0.8, -length * 0.15, width, -length * 0.6, width * 0.5, -length * 0.9);
      ctx.lineTo(0, -length * 0.75);
      ctx.lineTo(-width * 0.5, -length * 0.9);
      ctx.bezierCurveTo(-width, -length * 0.6, -width * 0.8, -length * 0.15, 0, 0);
    } else {
      // 通用花瓣：圆润贝塞尔曲线
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(width, -length * 0.2, width * 0.7, -length * 0.85, 0, -length);
      ctx.bezierCurveTo(-width * 0.7, -length * 0.85, -width, -length * 0.2, 0, 0);
    }
  }

  /** 将十六进制颜色按系数调暗（0-1，越小越暗），返回十六进制格式 */
  darkenColor(hex, factor) {
    const r = Math.min(255, Math.round(parseInt(hex.slice(1, 3), 16) * factor));
    const g = Math.min(255, Math.round(parseInt(hex.slice(3, 5), 16) * factor));
    const b = Math.min(255, Math.round(parseInt(hex.slice(5, 7), 16) * factor));
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  /** 绘制花蕊 —— 纯色小球，无额外装饰 */
  drawCenter(ctx) {
    const bloomProgress = Math.min(this.age / CONFIG.flowerBloomTime, 1);
    const centerSize = this.size * 0.16 * bloomProgress;
    if (centerSize <= 0) return;

    const { center } = this.colorSet;
    ctx.fillStyle = center;
    ctx.beginPath();
    ctx.arc(0, 0, centerSize, 0, Math.PI * 2);
    ctx.fill();
  }

  /**
   * 绘制环绕粒子 —— 椭圆轨道公转，分前后两半营造3D包裹感
   * @param {boolean} behind - true=绘制后方粒子，false=绘制前方粒子
   */
  drawOrbitParticles(ctx, behind) {
    if (!this.orbitParticles) return;
    const bloomProgress = Math.min(this.age / CONFIG.flowerBloomTime, 1);
    if (bloomProgress <= 0) return;

    for (const op of this.orbitParticles) {
      // 椭圆坐标：x = r*cos(angle), y = r*eccentricity*sin(angle)
      const px = Math.cos(op.angle) * op.radius;
      const py = Math.sin(op.angle) * op.radius * op.eccentricity;
      const isBehind = Math.sin(op.angle) < 0;

      // 只绘制对应层（前/后）
      if (behind !== isBehind) continue;

      // 后方粒子更暗更小，前方粒子更亮更大，增强景深
      const depthScale = isBehind ? 0.6 : 1.0;
      const depthAlpha = isBehind ? 0.4 : 0.85;
      const twinkle = 0.5 + 0.5 * Math.sin(this.age * op.twinkleSpeed + op.phase);
      const alpha = depthAlpha * twinkle * bloomProgress;
      if (alpha <= 0.01) continue;

      const r = op.size * depthScale;
      const glowR = r + CONFIG.orbitGlow * 0.4 * depthScale;

      // 径向渐变辉光替代shadowBlur
      const grad = ctx.createRadialGradient(px, py, 0, px, py, glowR);
      grad.addColorStop(0, hexToRgba(this.colorSet.petalEdge, alpha));
      grad.addColorStop(0.4, hexToRgba(this.colorSet.petalEdge, alpha * 0.5));
      grad.addColorStop(1, hexToRgba(this.colorSet.petalEdge, 0));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(px, py, glowR, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

/* ========================================================================
   ★ 对象池管理 —— 粒子与花瓣复用，避免频繁 GC
   ======================================================================== */

const particlePool = [];
const petalPool = [];
const fireworkPool = [];
const flowerPool = [];

function getParticle() {
  // 达到上限时复用最老的非活跃粒子
  if (particlePool.length < CONFIG.maxParticles) {
    const p = new Particle();
    particlePool.push(p);
    return p;
  }
  for (const p of particlePool) {
    if (!p.active) return p;
  }
  return null; // 池满且全部活跃，丢弃
}

function getFallingPetal() {
  for (const fp of petalPool) {
    if (!fp.active) return fp;
  }
  if (petalPool.length < 200) {
    const fp = new FallingPetal();
    petalPool.push(fp);
    return fp;
  }
  return null;
}

function getFirework() {
  for (const f of fireworkPool) {
    if (!f.active) return f;
  }
  if (fireworkPool.length < 30) {
    const f = new Firework();
    fireworkPool.push(f);
    return f;
  }
  return null;
}

function getFlower() {
  for (const f of flowerPool) {
    if (!f.active) return f;
  }
  if (flowerPool.length < CONFIG.flowerMaxCount + 2) {
    const f = new Flower();
    flowerPool.push(f);
    return f;
  }
  return null;
}

/* ========================================================================
   ★ 星空背景 —— 预生成星星，持续闪烁
   ======================================================================== */

const stars = [];

function initStars() {
  stars.length = 0;
  // 按屏幕面积比例计算星星数量（使用CSS像素 W/H，非设备像素）
  const count = Math.round(CONFIG.starCount * (W * H) / (1920 * 1080));
  for (let i = 0; i < Math.max(50, count); i++) {
    stars.push({
      x: rand(0, W),
      y: rand(0, H * 0.85),
      size: rand(CONFIG.starMinSize, CONFIG.starMaxSize),
      phase: rand(0, Math.PI * 2),
      speed: rand(CONFIG.starTwinkleSpeed * 0.5, CONFIG.starTwinkleSpeed * 1.5),
      baseAlpha: rand(0.2, 0.7),
    });
  }
}

function drawStars(ctx, time) {
  for (const s of stars) {
    const alpha = s.baseAlpha * (0.5 + 0.5 * Math.sin(time * s.speed + s.phase));
    ctx.fillStyle = `rgba(255, 250, 235, ${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
    // 较亮的星星加十字光芒
    if (s.size > 1.2 && alpha > 0.5) {
      ctx.strokeStyle = `rgba(255, 250, 235, ${alpha * 0.3})`;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(s.x - s.size * 3, s.y);
      ctx.lineTo(s.x + s.size * 3, s.y);
      ctx.moveTo(s.x, s.y - s.size * 3);
      ctx.lineTo(s.x, s.y + s.size * 3);
      ctx.stroke();
    }
  }
}

/* ========================================================================
   ★ 主控制器 —— 烟花秀编排、花朵生成、动画循环
   ======================================================================== */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const pauseIndicator = document.getElementById('pauseIndicator');

let W = 0, H = 0;
let isPaused = false;
let animFrameId = null;
let showTimer = 0;          // 当前烟花秀进度
let nextFireworkFrame = 0;  // 下一枚烟花发射帧
let flowerTimer = 0;        // 花朵生成计时
let frameCount = 0;         // 全局帧计数

/** 调整画布尺寸 */
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * CONFIG.dpr;
  canvas.height = H * CONFIG.dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(CONFIG.dpr, 0, 0, CONFIG.dpr, 0, 0);

  // 手机端降低粒子上限
  if (W < 768) {
    CONFIG.maxParticles = 900;
    CONFIG.starCount = 80;
  }
  initStars();
}

/** 发射一枚自动烟花 */
function spawnAutoFirework() {
  const fw = getFirework();
  if (!fw) return;
  const x = rand(W * 0.1, W * 0.9);
  const targetY = rand(H * CONFIG.explosionHeightMin, H * CONFIG.explosionHeightMax);
  // 配色比例：蓝色35% + 绿色35% + 暖色25% + 紫色5%
  const r = Math.random();
  let colorSet;
  if (r < 0.35) {
    colorSet = pick(FW_BLUE);
  } else if (r < 0.70) {
    colorSet = pick(FW_GREEN);
  } else if (r < 0.95) {
    colorSet = pick(FW_WARM);
  } else {
    colorSet = pick(FW_PURPLE);
  }
  fw.launch(x, targetY, colorSet, false);
}

/** 绽放一朵花（在页面中心附近随机出现，构图平衡） */
function spawnFlower() {
  const activeFlowers = flowerPool.filter(f => f.active).length;
  if (activeFlowers >= CONFIG.flowerMaxCount) return;

  const flower = getFlower();
  if (!flower) return;

  // 中心附近随机分布：水平±25%，垂直±18%，避免重叠
  const cx = W / 2;
  const cy = H / 2;
  let x, y, attempts = 0;
  do {
    x = cx + rand(-W * CONFIG.flowerCenterRangeX, W * CONFIG.flowerCenterRangeX);
    y = cy + rand(-H * CONFIG.flowerCenterRangeY, H * CONFIG.flowerCenterRangeY);
    attempts++;
  } while (attempts < 8 && flowerPool.some(f => f.active && Math.hypot(f.x - x, f.y - y) < 120));

  const type = pick(['rose', 'sakura', 'daisy']);
  const colorSet = pick(FLOWER_COLORS);
  const size = rand(CONFIG.flowerSizeMin, CONFIG.flowerSizeMax);
  flower.bloom(x, y, type, colorSet, size);
}

/** 在指定位置触发小型烟花（点击交互） */
function spawnClickFirework(x, y) {
  const fw = getFirework();
  if (!fw) return;
  const colorSet = pick(FIREWORK_COLORS);
  // 从点击位置下方短距离升起，在点击处爆炸
  fw.launch(x, y, colorSet, true);
  fw.y = y + 70;   // 起始位置：点击点下方70px
  fw.vy = -4.5;    // 较小的上升速度
  fw.vx = rand(-0.3, 0.3);
}

/* ---- 鼠标拖尾 ---- */
let mouseX = -100, mouseY = -100;
let lastMouseX = -100, lastMouseY = -100;

function updateMouseTrail() {
  if (mouseX < 0) return;
  const dx = mouseX - lastMouseX;
  const dy = mouseY - lastMouseY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 2) return;

  if (Math.random() < CONFIG.mouseTrailRate) {
    const p = getParticle();
    if (p) {
      p.reset(
        mouseX + rand(-3, 3), mouseY + rand(-3, 3),
        rand(-0.2, 0.2), rand(-0.2, 0.2),
        pick(['#FFF8E7', '#FFE4B5', '#E6E6FA']),
        CONFIG.mouseTrailLife,
        rand(0.6, 1.4)
      );
      p.type = 'mousetrail';
      p.glow = 6;
      p.friction = 0.95;
    }
  }
  lastMouseX = mouseX;
  lastMouseY = mouseY;
}

/* ========================================================================
   ★ 主循环
   ======================================================================== */

function animate() {
  if (isPaused) {
    animFrameId = requestAnimationFrame(animate);
    return;
  }

  frameCount++;

  // ---- 拖尾效果：半透明覆盖，创造柔和残影 ----
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgba(3, 4, 15, ${CONFIG.trailFadeAlpha})`;
  ctx.fillRect(0, 0, W, H);

  // ---- 星空 ----
  drawStars(ctx, frameCount);

  // ---- 自动烟花秀编排 ----
  showTimer++;
  if (showTimer >= CONFIG.showDuration) {
    // 一场秀结束，重新开始（随机性保证每场不同）
    showTimer = 0;
    nextFireworkFrame = frameCount + randInt(20, 40);
  }

  // 高潮段（秀的后40%）发射更密集
  const inFinale = showTimer > CONFIG.showDuration * CONFIG.finaleStart;
  const gap = inFinale
    ? CONFIG.showFireworkMinGap * CONFIG.finaleMultiplier
    : rand(CONFIG.showFireworkMinGap, CONFIG.showFireworkMaxGap);

  if (frameCount >= nextFireworkFrame) {
    spawnAutoFirework();
    nextFireworkFrame = frameCount + gap;
    // 高潮段偶尔双发
    if (inFinale && Math.random() < 0.4) {
      setTimeout(() => spawnAutoFirework(), 100);
    }
  }

  // ---- 花朵定时生成 ----
  flowerTimer++;
  if (flowerTimer >= CONFIG.flowerSpawnInterval) {
    flowerTimer = 0;
    spawnFlower();
  }

  // ---- 鼠标拖尾 ----
  updateMouseTrail();

  // ---- 加法混合绘制烟花（璀璨叠加效果）----
  ctx.globalCompositeOperation = 'lighter';

  // 更新并绘制烟花火箭
  for (const fw of fireworkPool) {
    fw.update(particlePool);
    fw.draw(ctx);
  }

  // 更新并绘制粒子
  for (const p of particlePool) {
    p.update();
    p.draw(ctx);
  }

  // 更新并绘制飘落花瓣
  for (const fp of petalPool) {
    fp.update();
    fp.draw(ctx);
  }

  // ---- 正常混合绘制花朵（不与烟花叠加）----
  ctx.globalCompositeOperation = 'source-over';
  for (const flower of flowerPool) {
    try {
      flower.update();
      flower.draw(ctx);
    } catch (e) {
      // 单朵花渲染异常不影响整场动画，静默停用该花
      flower.active = false;
      console.warn('Flower render error:', e);
    }
  }

  animFrameId = requestAnimationFrame(animate);
}

/* ========================================================================
   ★ 交互事件绑定
   ======================================================================== */

/* ---- 彩蛋：连续点击花朵中心5次 ---- */
let flowerCenterClickCount = 0;   // 连续命中花朵中心的次数
let lastFlowerCenterClick = 0;    // 上次命中时间戳（用于超时重置）
const FLOWER_CENTER_TIMEOUT = 3000; // 连续点击超时（毫秒），超过则重置
let loveMessageTimer = null;

/** 检测点击坐标是否落在某朵花的中心区域 */
function isClickOnFlowerCenter(x, y) {
  for (const flower of flowerPool) {
    if (!flower.active) continue;
    // 花朵中心判定半径：花朵尺寸的30%（约等于纯色花心的范围）
    const centerRadius = flower.size * 0.35;
    const dist = Math.hypot(x - flower.x, y - flower.y);
    if (dist <= centerRadius) return true;
  }
  return false;
}

/** 显示"我爱你"文字，停留后自动淡出 */
function showLoveMessage() {
  const el = document.getElementById('loveMessage');
  el.classList.add('show');
  // 清除之前的定时器
  if (loveMessageTimer) clearTimeout(loveMessageTimer);
  // 4秒后淡出
  loveMessageTimer = setTimeout(() => {
    el.classList.remove('show');
  }, 4000);
}

// 鼠标 / 触摸点击：在点击处绽放小型烟花 + 花瓣 + 彩蛋检测
function handleClick(e) {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
  const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
  spawnClickFirework(x, y);

  // ---- 彩蛋逻辑：连续点击花朵中心5次 ----
  const now = Date.now();
  if (isClickOnFlowerCenter(x, y)) {
    // 超时则重置计数
    if (now - lastFlowerCenterClick > FLOWER_CENTER_TIMEOUT) {
      flowerCenterClickCount = 0;
    }
    flowerCenterClickCount++;
    lastFlowerCenterClick = now;

    if (flowerCenterClickCount >= 5) {
      showLoveMessage();
      flowerCenterClickCount = 0; // 触发后重置，可再次触发
    }
  } else {
    // 点击非花朵中心区域，重置连续计数
    flowerCenterClickCount = 0;
  }
}

canvas.addEventListener('click', handleClick);
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  handleClick(e);
}, { passive: false });

// 鼠标移动：记录位置用于星光拖尾
canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});
canvas.addEventListener('mouseleave', () => {
  mouseX = -100; mouseY = -100;
});

// 键盘：空格切换全屏，P 暂停/继续
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  } else if (e.code === 'KeyP') {
    isPaused = !isPaused;
    pauseIndicator.classList.toggle('show', isPaused);
  }
});

// 窗口大小变化
window.addEventListener('resize', resize);

/* ========================================================================
   ★ 启动
   ======================================================================== */

resize();
// 开场延迟一小会儿，让标题先浮现
setTimeout(() => {
  nextFireworkFrame = frameCount + 30;
  // 开场先绽放两朵花，营造静谧氛围
  spawnFlower();
  setTimeout(spawnFlower, 500);
  animate();
}, 800);

</script>
