<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>梦幻烟花秀 · 花朵绽放</title>
<style>
  /* ========== 全局重置与基础样式 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Georgia", "Songti SC", "SimSun", serif;
    cursor: crosshair;
  }

  /* 画布全屏覆盖 */
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    /* 深邃午夜蓝到墨黑的径向渐变背景 */
    background: radial-gradient(ellipse at 50% 60%,
      #0d1033 0%,
      #070a1f 35%,
      #03040f 65%,
      #000000 100%);
  }

  /* 操作提示 —— 优雅淡入后常驻角落 */
  #hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 240, 220, 0.45);
    font-size: 13px;
    letter-spacing: 3px;
    text-align: center;
    pointer-events: none;
    animation: hintFade 3s ease-in-out infinite;
    z-index: 10;
    text-shadow: 0 0 12px rgba(255, 200, 150, 0.3);
  }

  @keyframes hintFade {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 0.7; }
  }

  /* 标题 —— 页面加载时优雅浮现 */
  #title {
    position: fixed;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 235, 210, 0.85);
    font-size: clamp(22px, 4vw, 38px);
    letter-spacing: 12px;
    text-indent: 12px; /* 抵消最后一个字的字距 */
    font-weight: 300;
    pointer-events: none;
    z-index: 10;
    text-shadow:
      0 0 20px rgba(255, 180, 130, 0.4),
      0 0 60px rgba(255, 150, 100, 0.2);
    animation: titleIn 2.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes titleIn {
    0%   { opacity: 0; transform: translateX(-50%) translateY(20px); letter-spacing: 30px; }
    100% { opacity: 0.85; transform: translateX(-50%) translateY(0); letter-spacing: 12px; }
  }

  /* 暂停指示器 */
  #pauseIndicator {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255, 240, 220, 0.6);
    font-size: 28px;
    letter-spacing: 8px;
    pointer-events: none;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.4s ease;
    text-shadow: 0 0 20px rgba(255, 200, 150, 0.5);
  }
  #pauseIndicator.show { opacity: 1; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="title">烟花与花</div>
<div id="hint">点击绽放烟花 · 空格全屏 · P 暂停</div>
<div id="pauseIndicator">暂 停</div>

<script>
'use strict';

/* ========================================================================
   ★ 配置参数区 —— 所有可调参数集中在此，如同艺术品的调色盘
   ======================================================================== */

const CONFIG = {
  // ---- 画布与性能 ----
  maxParticles: 1800,        // 粒子总数上限（手机端自动减半）
  trailFadeAlpha: 0.10,      // 每帧拖尾残留透明度（越小拖尾越长）
  dpr: Math.min(window.devicePixelRatio || 1, 2), // 设备像素比上限2，兼顾清晰与性能

  // ---- 星空背景 ----
  starCount: 180,            // 星星数量
  starMinSize: 0.3,          // 星星最小半径
  starMaxSize: 1.6,          // 星星最大半径
  starTwinkleSpeed: 0.015,   // 闪烁速度（弧度/帧）

  // ---- 烟花火箭 ----
  rocketSpeed: 7,            // 火箭上升初速度
  rocketGravity: 0.06,       // 火箭受到的重力
  rocketTrailRate: 2,        // 火箭每帧生成拖尾粒子数
  rocketTrailLife: 25,       // 拖尾粒子寿命（帧）
  explosionHeightMin: 0.20,  // 爆炸最低高度（屏幕高度比例）
  explosionHeightMax: 0.55,  // 爆炸最高高度（屏幕高度比例）

  // ---- 爆炸粒子 ----
  sparkCountMin: 70,         // 单次爆炸最少粒子数
  sparkCountMax: 130,        // 单次爆炸最多粒子数
  sparkSpeedMin: 2.5,        // 粒子初速度下限
  sparkSpeedMax: 6.5,        // 粒子初速度上限
  sparkGravity: 0.035,       // 爆炸粒子重力（缓慢飘落）
  sparkFriction: 0.985,      // 空气阻力（速度衰减系数）
  sparkLifeMin: 80,          // 粒子最短寿命
  sparkLifeMax: 140,         // 粒子最长寿命
  sparkSizeMin: 1.2,         // 粒子最小半径
  sparkSizeMax: 2.8,         // 粒子最大半径
  sparkTwinkleChance: 0.35,  // 粒子闪烁概率
  sparkGlow: 12,             // 粒子辉光半径（shadowBlur）

  // ---- 中心闪光 ----
  flashRadius: 60,           // 爆炸瞬间中心闪光半径
  flashLife: 12,             // 闪光持续帧数

  // ---- 花瓣飘落（烟花散落） ----
  petalChance: 0.45,         // 烟花散落花瓣的概率
  petalCountMin: 3,          // 最少散落花瓣数
  petalCountMax: 8,          // 最多散落花瓣数
  petalFallSpeed: 0.6,       // 花瓣下落速度
  petalSway: 0.02,           // 花瓣左右摆动幅度
  petalLife: 180,            // 花瓣寿命
  petalSize: 5,              // 花瓣大小

  // ---- 自动烟花秀 ----
  showDuration: 720,         // 一场秀时长（12秒 × 60fps）
  showFireworkMinGap: 25,    // 烟花最短间隔（帧）
  showFireworkMaxGap: 65,    // 烟花最长间隔（帧）
  finaleStart: 0.6,          // 高潮段起始比例（秀的60%处进入密集发射）
  finaleMultiplier: 0.35,    // 高潮期间隔缩短比例

  // ---- 花朵绽放 ----
  flowerSpawnInterval: 200,  // 花朵生成间隔（帧）
  flowerMaxCount: 6,         // 屏幕上最多同时存在的花朵数
  flowerBloomTime: 90,       // 花朵绽放总时长（帧）
  flowerHoldTime: 240,       // 花朵盛开停留时长（帧）
  flowerFadeTime: 120,       // 花朵淡出时长（帧）
  flowerSizeMin: 35,         // 花朵最小尺寸
  flowerSizeMax: 70,         // 花朵最大尺寸
  flowerBottomMargin: 0.15,  // 花朵距底部最小距离（屏幕比例）

  // ---- 鼠标交互 ----
  clickSparkCount: 45,       // 点击烟花粒子数
  clickPetalCount: 4,        // 点击伴随花瓣数
  mouseTrailRate: 0.6,       // 鼠标拖尾生成概率（每帧）
  mouseTrailLife: 30,        // 鼠标拖尾粒子寿命
};

/* ---- 烟花配色：暖金、玫瑰粉、香槟橙、宝石红，点缀冰蓝与薰衣草紫 ---- */
const FIREWORK_COLORS = [
  { core: '#FFFFFF', mid: '#FFD700', edge: '#FFA500' },  // 暖金
  { core: '#FFFFFF', mid: '#FF6B9D', edge: '#E63946' },  // 玫瑰粉
  { core: '#FFFFFF', mid: '#FFB347', edge: '#FF8C42' },  // 香槟橙
  { core: '#FFFFFF', mid: '#E63946', edge: '#B71C1C' },  // 宝石红
  { core: '#FFFFFF', mid: '#A8D8EA', edge: '#5DADE2' },  // 冰蓝（点缀）
  { core: '#FFFFFF', mid: '#B388EB', edge: '#7C4DFF' },  // 薰衣草紫（点缀）
];

/* ---- 花朵配色：奶油白、樱花粉、淡鹅黄、香芋紫 ---- */
const FLOWER_COLORS = [
  { petal: '#FFF8E7', petalEdge: '#F5E6C8', center: '#FFD700' },  // 奶油白
  { petal: '#FFB7C5', petalEdge: '#FF8FA3', center: '#FFD700' },  // 樱花粉
  { petal: '#FFFACD', petalEdge: '#F0E68C', center: '#FFA500' },  // 淡鹅黄
  { petal: '#D8BFD8', petalEdge: '#B8A0C8', center: '#FFD700' },  // 香芋紫
  { petal: '#FFE4E1', petalEdge: '#FFB6C1', center: '#FFC125' },  // 薄雾粉
];

/* ---- 花瓣飘落配色 ---- */
const FALLING_PETAL_COLORS = [
  '#FFB7C5', '#FF8FA3', '#FFF8E7', '#FFDAB9', '#D8BFD8', '#FFC0CB'
];

/* ========================================================================
   ★ 工具函数
   ======================================================================== */

/** 在 [min, max] 区间取随机浮点数 */
function rand(min, max) { return Math.random() * (max - min) + min; }

/** 在 [min, max] 区间取随机整数 */
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

/** 从数组中随机取一个元素 */
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/** 三次缓出：开始快、结束慢，适合自然运动 */
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

/** 弹性缓出：带有轻微过冲和回弹，适合花瓣绽放 */
function easeOutElastic(t) {
  if (t === 0 || t === 1) return t;
  const c4 = (2 * Math.PI) / 3;
  return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
}

/** 二次缓入缓出：平滑的加速减速，适合整体过渡 */
function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

/** 将十六进制颜色转为 rgba 字符串，支持透明度 */
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/** 在两种十六进制颜色之间插值，t ∈ [0,1] */
function lerpColor(hex1, hex2, t) {
  const r1 = parseInt(hex1.slice(1, 3), 16), g1 = parseInt(hex1.slice(3, 5), 16), b1 = parseInt(hex1.slice(5, 7), 16);
  const r2 = parseInt(hex2.slice(1, 3), 16), g2 = parseInt(hex2.slice(3, 5), 16), b2 = parseInt(hex2.slice(5, 7), 16);
  const r = Math.round(r1 + (r2 - r1) * t);
  const g = Math.round(g1 + (g2 - g1) * t);
  const b = Math.round(b1 + (b2 - b1) * t);
  return `rgb(${r},${g},${b})`;
}

/* ========================================================================
   ★ Particle 类 —— 通用粒子（烟花拖尾、爆炸火花、闪光、鼠标拖尾）
   ======================================================================== */

class Particle {
  constructor() { this.reset(0, 0, 0, 0, '#FFF', 1, 1); }

  /**
   * 重置粒子参数（对象池复用）
   * @param {number} x, y - 初始位置
   * @param {number} vx, vy - 初始速度
   * @param {string} color - 十六进制颜色
   * @param {number} life - 寿命（帧）
   * @param {number} size - 半径
   */
  reset(x, y, vx, vy, color, life, size) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.color = color;
    this.life = life;
    this.maxLife = life;
    this.size = size;
    this.gravity = 0;
    this.friction = 1;
    this.glow = 0;
    this.twinkle = false;
    this.twinklePhase = rand(0, Math.PI * 2);
    this.type = 'spark'; // spark | trail | flash | mousetrail
    this.active = true;
  }

  update() {
    if (!this.active) return;
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    if (this.life <= 0) this.active = false;
  }

  draw(ctx) {
    if (!this.active) return;
    // 寿命比例：1 = 刚出生，0 = 即将消失
    const lifeRatio = this.life / this.maxLife;

    // 闪烁效果：部分粒子在生命周期内明暗交替
    let alpha = lifeRatio;
    if (this.twinkle) {
      alpha *= 0.5 + 0.5 * Math.sin(this.twinklePhase + this.life * 0.15);
    }

    // 闪光类型：半径随寿命快速衰减
    if (this.type === 'flash') {
      const flashAlpha = lifeRatio * 0.6;
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * lifeRatio);
      grad.addColorStop(0, `rgba(255,255,255,${flashAlpha})`);
      grad.addColorStop(0.3, hexToRgba(this.color, flashAlpha * 0.5));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * lifeRatio, 0, Math.PI * 2);
      ctx.fill();
      return;
    }

    // 普通粒子：带辉光的圆点
    if (this.glow > 0) {
      ctx.shadowBlur = this.glow;
      ctx.shadowColor = this.color;
    }
    ctx.fillStyle = hexToRgba(this.color, Math.max(0, alpha));
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * (0.6 + 0.4 * lifeRatio), 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

/* ========================================================================
   ★ FallingPetal 类 —— 从烟花散落的飘落花瓣
   ======================================================================== */

class FallingPetal {
  constructor() { this.active = false; }

  reset(x, y, color) {
    this.x = x; this.y = y;
    this.vx = rand(-0.8, 0.8);
    this.vy = rand(0.3, CONFIG.petalFallSpeed);
    this.color = color;
    this.life = CONFIG.petalLife;
    this.maxLife = CONFIG.petalLife;
    this.size = rand(CONFIG.petalSize * 0.7, CONFIG.petalSize * 1.3);
    this.rotation = rand(0, Math.PI * 2);
    this.rotSpeed = rand(-0.03, 0.03);
    this.swayPhase = rand(0, Math.PI * 2);
    this.active = true;
  }

  update() {
    if (!this.active) return;
    this.swayPhase += CONFIG.petalSway;
    this.x += this.vx + Math.sin(this.swayPhase) * 0.5;
    this.y += this.vy;
    this.vy += 0.005; // 轻微重力加速
    this.rotation += this.rotSpeed;
    this.life--;
    if (this.life <= 0) this.active = false;
  }

  draw(ctx) {
    if (!this.active) return;
    const lifeRatio = this.life / this.maxLife;
    // 淡出阶段在后半段开始
    const alpha = lifeRatio > 0.4 ? 1 : lifeRatio / 0.4;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.globalAlpha = alpha * 0.85;

    // 绘制单片花瓣（贝塞尔曲线，细长椭圆）
    ctx.beginPath();
    ctx.moveTo(0, -this.size * 0.5);
    ctx.bezierCurveTo(
      this.size * 0.5, -this.size * 0.3,
      this.size * 0.4, this.size * 0.4,
      0, this.size * 0.5
    );
    ctx.bezierCurveTo(
      -this.size * 0.4, this.size * 0.4,
      -this.size * 0.5, -this.size * 0.3,
      0, -this.size * 0.5
    );
    ctx.fillStyle = this.color;
    ctx.fill();

    // 花瓣高光（半透明纵向条纹）
    ctx.globalAlpha = alpha * 0.3;
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, -this.size * 0.4);
    ctx.quadraticCurveTo(this.size * 0.1, 0, 0, this.size * 0.4);
    ctx.stroke();

    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

/* ========================================================================
   ★ Firework 类 —— 烟花火箭（上升 → 爆炸）
   ======================================================================== */

class Firework {
  constructor() { this.active = false; }

  /**
   * 发射一枚烟花
   * @param {number} startX - 起始x坐标（底部）
   * @param {number} targetY - 目标爆炸高度y
   * @param {object} colorSet - 配色方案 {core, mid, edge}
   * @param {boolean} small - 是否为小型（点击触发）
   */
  launch(startX, targetY, colorSet, small = false) {
    this.x = startX;
    this.y = H + 10;  // 从屏幕底部下方升起（使用CSS像素坐标）
    this.targetY = targetY;
    this.colorSet = colorSet;
    this.small = small;
    // 初速度：根据目标高度计算，确保能到达目标位置
    this.vy = -CONFIG.rocketSpeed * (small ? 0.7 : 1);
    this.vx = rand(-0.5, 0.5);
    this.exploded = false;
    this.active = true;
    this.trailTimer = 0;
  }

  update(particles) {
    if (!this.active) return;

    // 上升阶段
    if (!this.exploded) {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += CONFIG.rocketGravity;

      // 生成拖尾粒子
      this.trailTimer++;
      if (this.trailTimer >= 1) {
        this.trailTimer = 0;
        for (let i = 0; i < CONFIG.rocketTrailRate; i++) {
          const p = getParticle();
          if (p) {
            p.reset(
              this.x + rand(-1, 1), this.y + rand(0, 4),
              rand(-0.3, 0.3), rand(0.5, 1.5),
              this.colorSet.mid,
              CONFIG.rocketTrailLife,
              rand(1, 2)
            );
            p.type = 'trail';
            p.gravity = 0.02;
            p.friction = 0.96;
          }
        }
      }

      // 到达目标高度或速度减为零时爆炸
      if (this.y <= this.targetY || this.vy >= -0.5) {
        this.explode(particles);
      }
    }
  }

  /** 爆炸：生成放射状粒子群 */
  explode(particles) {
    this.exploded = true;
    this.active = false;

    const count = this.small
      ? CONFIG.clickSparkCount
      : randInt(CONFIG.sparkCountMin, CONFIG.sparkCountMax);

    // 中心闪光
    const flash = getParticle();
    if (flash) {
      flash.reset(this.x, this.y, 0, 0, this.colorSet.mid, CONFIG.flashLife, CONFIG.flashRadius);
      flash.type = 'flash';
    }

    // 爆炸粒子 —— 均匀放射状分布（球形/菊花形）
    for (let i = 0; i < count; i++) {
      const p = getParticle();
      if (!p) break;

      // 均匀角度 + 随机速度，形成饱满的球形
      const angle = (Math.PI * 2 * i) / count + rand(-0.05, 0.05);
      const speed = rand(CONFIG.sparkSpeedMin, CONFIG.sparkSpeedMax) * (this.small ? 0.6 : 1);

      // 颜色：大部分用 mid 色，少量用 edge 色增加层次
      const useEdge = Math.random() < 0.3;
      const color = useEdge ? this.colorSet.edge : this.colorSet.mid;

      p.reset(
        this.x, this.y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        color,
        randInt(CONFIG.sparkLifeMin, CONFIG.sparkLifeMax),
        rand(CONFIG.sparkSizeMin, CONFIG.sparkSizeMax)
      );
      p.gravity = CONFIG.sparkGravity;
      p.friction = CONFIG.sparkFriction;
      p.glow = CONFIG.sparkGlow;
      p.twinkle = Math.random() < CONFIG.sparkTwinkleChance;
      p.type = 'spark';
    }

    // 散落花瓣（诗意惊喜）
    const petalCount = this.small
      ? CONFIG.clickPetalCount
      : (Math.random() < CONFIG.petalChance ? randInt(CONFIG.petalCountMin, CONFIG.petalCountMax) : 0);

    for (let i = 0; i < petalCount; i++) {
      const fp = getFallingPetal();
      if (fp) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(0.5, 2);
        fp.reset(
          this.x + Math.cos(angle) * 10,
          this.y + Math.sin(angle) * 10,
          pick(FALLING_PETAL_COLORS)
        );
        fp.vx = Math.cos(angle) * speed;
        fp.vy = Math.sin(angle) * speed * 0.5 + 0.5;
      }
    }
  }

  draw(ctx) {
    if (!this.active || this.exploded) return;
    // 火箭头部：明亮的光点带辉光
    ctx.save();
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.colorSet.core;
    ctx.fillStyle = this.colorSet.core;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
    // 火箭外层光晕
    ctx.shadowBlur = 0;
    ctx.fillStyle = hexToRgba(this.colorSet.mid, 0.4);
    ctx.beginPath();
    ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/* ========================================================================
   ★ Flower 类 —— 绽放的花朵（玫瑰 / 樱花 / 雏菊）
   *  使用贝塞尔曲线绘制花瓣，逐层舒展，带弹性回弹
   ======================================================================== */

class Flower {
  constructor() { this.active = false; }

  /**
   * 在指定位置绽放一朵花
   * @param {number} x, y - 花朵中心坐标
   * @param {string} type - 'rose' | 'sakura' | 'daisy'
   * @param {object} colorSet - 配色 {petal, petalEdge, center}
   * @param {number} size - 花朵尺寸（半径基准）
   */
  bloom(x, y, type, colorSet, size) {
    this.x = x;
    this.y = y;
    this.type = type;
    this.colorSet = colorSet;
    this.size = size;
    this.age = 0;
    this.active = true;

    // 总生命周期 = 绽放 + 停留 + 淡出
    this.totalLife = CONFIG.flowerBloomTime + CONFIG.flowerHoldTime + CONFIG.flowerFadeTime;

    // 根据花型初始化花瓣配置
    this.petals = this.createPetals();
  }

  /** 根据花型创建花瓣参数列表 */
  createPetals() {
    const petals = [];
    if (this.type === 'rose') {
      // 玫瑰：3~4层花瓣，每层数量递增，层间旋转偏移
      const layers = randInt(3, 4);
      for (let layer = 0; layer < layers; layer++) {
        const count = 5 + layer * 2;           // 每层花瓣数
        const layerScale = 0.4 + layer * 0.25; // 越外层越大
        const rotOffset = layer * 0.3;         // 层间旋转偏移，营造螺旋感
        const delay = layer * 12;              // 外层延迟绽放
        for (let i = 0; i < count; i++) {
          petals.push({
            angle: (Math.PI * 2 * i) / count + rotOffset,
            length: this.size * layerScale * rand(0.85, 1.1),
            width: this.size * layerScale * 0.55 * rand(0.9, 1.1),
            delay: delay + rand(0, 6),
            layer: layer,
          });
        }
      }
    } else if (this.type === 'sakura') {
      // 樱花：5片花瓣，花瓣尖端有凹缺
      for (let i = 0; i < 5; i++) {
        petals.push({
          angle: (Math.PI * 2 * i) / 5 - Math.PI / 2,
          length: this.size * rand(0.9, 1.1),
          width: this.size * 0.65 * rand(0.9, 1.1),
          delay: rand(0, 8),
          notch: true, // 尖端凹缺
        });
      }
    } else {
      // 雏菊：12~16片细长花瓣，分两层交错
      const count = randInt(12, 16);
      for (let layer = 0; layer < 2; layer++) {
        for (let i = 0; i < count; i++) {
          petals.push({
            angle: (Math.PI * 2 * i) / count + layer * (Math.PI / count),
            length: this.size * (layer === 0 ? 1 : 0.75) * rand(0.95, 1.05),
            width: this.size * 0.2 * rand(0.9, 1.1), // 细长
            delay: layer * 8 + rand(0, 5),
          });
        }
      }
    }
    return petals;
  }

  update() {
    if (!this.active) return;
    this.age++;
    if (this.age >= this.totalLife) this.active = false;
  }

  /** 计算单瓣花瓣的绽放进度（带延迟和弹性） */
  petalProgress(petal) {
    const effectiveAge = this.age - petal.delay;
    if (effectiveAge <= 0) return 0;
    const t = Math.min(effectiveAge / (CONFIG.flowerBloomTime * 0.7), 1);
    return easeOutElastic(t);
  }

  /** 计算整朵花的透明度（绽放渐入 / 停留 / 淡出） */
  getAlpha() {
    if (this.age < CONFIG.flowerBloomTime) {
      return easeOutCubic(this.age / CONFIG.flowerBloomTime);
    }
    const fadeStart = CONFIG.flowerBloomTime + CONFIG.flowerHoldTime;
    if (this.age > fadeStart) {
      const t = (this.age - fadeStart) / CONFIG.flowerFadeTime;
      return Math.max(0, 1 - easeInOutQuad(t));
    }
    return 1;
  }

  draw(ctx) {
    if (!this.active) return;
    const alpha = this.getAlpha();
    if (alpha <= 0) return;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalAlpha = alpha;

    // 逐瓣绘制（从外层到内层，使内层花瓣覆盖在上方）
    const sorted = [...this.petals].sort((a, b) => (b.layer || 0) - (a.layer || 0));

    for (const petal of sorted) {
      const progress = this.petalProgress(petal);
      if (progress <= 0) continue;

      ctx.save();
      ctx.rotate(petal.angle);

      // 花瓣从花心向外舒展：闭合时指向中心（旋转-90°），开放时平展
      const openRotation = -Math.PI / 2 + (Math.PI / 2) * progress;
      ctx.rotate(openRotation);

      const petalLength = petal.length * progress;
      const petalWidth = petal.width * (0.3 + 0.7 * progress);

      this.drawPetal(ctx, petalLength, petalWidth, petal);
      ctx.restore();
    }

    // 花蕊：金色细小光点
    this.drawCenter(ctx);

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /** 绘制单片花瓣 —— 贝塞尔曲线，丝绒/薄纱质感 */
  drawPetal(ctx, length, width, petal) {
    const { petal: baseColor, petalEdge } = this.colorSet;

    // 花瓣渐变：基部深 → 边缘浅，营造透光感
    const grad = ctx.createLinearGradient(0, 0, 0, -length);
    grad.addColorStop(0, hexToRgba(petalEdge, 0.9));
    grad.addColorStop(0.5, hexToRgba(baseColor, 0.85));
    grad.addColorStop(1, hexToRgba(baseColor, 0.6));

    ctx.fillStyle = grad;
    ctx.beginPath();

    if (petal.notch) {
      // 樱花花瓣：尖端有凹缺
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(width * 0.8, -length * 0.15, width, -length * 0.6, width * 0.5, -length * 0.9);
      ctx.lineTo(0, -length * 0.75); // 凹缺
      ctx.lineTo(-width * 0.5, -length * 0.9);
      ctx.bezierCurveTo(-width, -length * 0.6, -width * 0.8, -length * 0.15, 0, 0);
    } else {
      // 通用花瓣：圆润的贝塞尔曲线
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(
        width, -length * 0.2,
        width * 0.7, -length * 0.85,
        0, -length
      );
      ctx.bezierCurveTo(
        -width * 0.7, -length * 0.85,
        -width, -length * 0.2,
        0, 0
      );
    }
    ctx.fill();

    // 花瓣边缘高光（薄纱透光感）
    ctx.strokeStyle = hexToRgba('#FFFFFF', 0.25);
    ctx.lineWidth = 0.6;
    ctx.stroke();

    // 花瓣脉络（极细线条，增加丝绒质感）
    ctx.strokeStyle = hexToRgba(petalEdge, 0.2);
    ctx.lineWidth = 0.4;
    ctx.beginPath();
    ctx.moveTo(0, -length * 0.05);
    ctx.quadraticCurveTo(width * 0.05, -length * 0.5, 0, -length * 0.9);
    ctx.stroke();
  }

  /** 绘制花蕊：金色光点环 */
  drawCenter(ctx) {
    const bloomProgress = Math.min(this.age / CONFIG.flowerBloomTime, 1);
    const centerSize = this.size * 0.18 * bloomProgress;
    if (centerSize <= 0) return;

    const { center } = this.colorSet;

    // 花蕊基座
    ctx.fillStyle = hexToRgba(center, 0.8);
    ctx.beginPath();
    ctx.arc(0, 0, centerSize, 0, Math.PI * 2);
    ctx.fill();

    // 金色光点环绕
    const dotCount = this.type === 'daisy' ? 12 : 8;
    for (let i = 0; i < dotCount; i++) {
      const angle = (Math.PI * 2 * i) / dotCount + this.age * 0.005;
      const r = centerSize * 0.6;
      const dx = Math.cos(angle) * r;
      const dy = Math.sin(angle) * r;
      const twinkle = 0.6 + 0.4 * Math.sin(this.age * 0.08 + i);
      ctx.fillStyle = hexToRgba('#FFEC8B', twinkle);
      ctx.beginPath();
      ctx.arc(dx, dy, centerSize * 0.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

/* ========================================================================
   ★ 对象池管理 —— 粒子与花瓣复用，避免频繁 GC
   ======================================================================== */

const particlePool = [];
const petalPool = [];
const fireworkPool = [];
const flowerPool = [];

function getParticle() {
  // 达到上限时复用最老的非活跃粒子
  if (particlePool.length < CONFIG.maxParticles) {
    const p = new Particle();
    particlePool.push(p);
    return p;
  }
  for (const p of particlePool) {
    if (!p.active) return p;
  }
  return null; // 池满且全部活跃，丢弃
}

function getFallingPetal() {
  for (const fp of petalPool) {
    if (!fp.active) return fp;
  }
  if (petalPool.length < 200) {
    const fp = new FallingPetal();
    petalPool.push(fp);
    return fp;
  }
  return null;
}

function getFirework() {
  for (const f of fireworkPool) {
    if (!f.active) return f;
  }
  if (fireworkPool.length < 30) {
    const f = new Firework();
    fireworkPool.push(f);
    return f;
  }
  return null;
}

function getFlower() {
  for (const f of flowerPool) {
    if (!f.active) return f;
  }
  if (flowerPool.length < CONFIG.flowerMaxCount + 2) {
    const f = new Flower();
    flowerPool.push(f);
    return f;
  }
  return null;
}

/* ========================================================================
   ★ 星空背景 —— 预生成星星，持续闪烁
   ======================================================================== */

const stars = [];

function initStars() {
  stars.length = 0;
  // 按屏幕面积比例计算星星数量（使用CSS像素 W/H，非设备像素）
  const count = Math.round(CONFIG.starCount * (W * H) / (1920 * 1080));
  for (let i = 0; i < Math.max(50, count); i++) {
    stars.push({
      x: rand(0, W),
      y: rand(0, H * 0.85),
      size: rand(CONFIG.starMinSize, CONFIG.starMaxSize),
      phase: rand(0, Math.PI * 2),
      speed: rand(CONFIG.starTwinkleSpeed * 0.5, CONFIG.starTwinkleSpeed * 1.5),
      baseAlpha: rand(0.2, 0.7),
    });
  }
}

function drawStars(ctx, time) {
  for (const s of stars) {
    const alpha = s.baseAlpha * (0.5 + 0.5 * Math.sin(time * s.speed + s.phase));
    ctx.fillStyle = `rgba(255, 250, 235, ${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
    // 较亮的星星加十字光芒
    if (s.size > 1.2 && alpha > 0.5) {
      ctx.strokeStyle = `rgba(255, 250, 235, ${alpha * 0.3})`;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(s.x - s.size * 3, s.y);
      ctx.lineTo(s.x + s.size * 3, s.y);
      ctx.moveTo(s.x, s.y - s.size * 3);
      ctx.lineTo(s.x, s.y + s.size * 3);
      ctx.stroke();
    }
  }
}

/* ========================================================================
   ★ 主控制器 —— 烟花秀编排、花朵生成、动画循环
   ======================================================================== */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const pauseIndicator = document.getElementById('pauseIndicator');

let W = 0, H = 0;
let isPaused = false;
let animFrameId = null;
let showTimer = 0;          // 当前烟花秀进度
let nextFireworkFrame = 0;  // 下一枚烟花发射帧
let flowerTimer = 0;        // 花朵生成计时
let frameCount = 0;         // 全局帧计数

/** 调整画布尺寸 */
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * CONFIG.dpr;
  canvas.height = H * CONFIG.dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(CONFIG.dpr, 0, 0, CONFIG.dpr, 0, 0);

  // 手机端降低粒子上限
  if (W < 768) {
    CONFIG.maxParticles = 900;
    CONFIG.starCount = 80;
  }
  initStars();
}

/** 发射一枚自动烟花 */
function spawnAutoFirework() {
  const fw = getFirework();
  if (!fw) return;
  const x = rand(W * 0.1, W * 0.9);
  const targetY = rand(H * CONFIG.explosionHeightMin, H * CONFIG.explosionHeightMax);
  // 70% 暖色系，30% 冷色系点缀
  const colorSet = Math.random() < 0.7
    ? pick(FIREWORK_COLORS.slice(0, 4))
    : pick(FIREWORK_COLORS);
  fw.launch(x, targetY, colorSet, false);
}

/** 绽放一朵花（位置随机但构图平衡） */
function spawnFlower() {
  const activeFlowers = flowerPool.filter(f => f.active).length;
  if (activeFlowers >= CONFIG.flowerMaxCount) return;

  const flower = getFlower();
  if (!flower) return;

  // 构图平衡：底部区域为主，偶尔在中部
  const useBottom = Math.random() < 0.7;
  const x = useBottom
    ? rand(W * 0.08, W * 0.92)
    : rand(W * 0.15, W * 0.85);
  const y = useBottom
    ? rand(H * (1 - CONFIG.flowerBottomMargin - 0.1), H * (1 - CONFIG.flowerBottomMargin))
    : rand(H * 0.4, H * 0.65);

  const type = pick(['rose', 'sakura', 'daisy']);
  const colorSet = pick(FLOWER_COLORS);
  const size = rand(CONFIG.flowerSizeMin, CONFIG.flowerSizeMax);
  flower.bloom(x, y, type, colorSet, size);
}

/** 在指定位置触发小型烟花（点击交互） */
function spawnClickFirework(x, y) {
  const fw = getFirework();
  if (!fw) return;
  const colorSet = pick(FIREWORK_COLORS);
  // 从点击位置下方短距离升起，在点击处爆炸
  fw.launch(x, y, colorSet, true);
  fw.y = y + 70;   // 起始位置：点击点下方70px
  fw.vy = -4.5;    // 较小的上升速度
  fw.vx = rand(-0.3, 0.3);
}

/* ---- 鼠标拖尾 ---- */
let mouseX = -100, mouseY = -100;
let lastMouseX = -100, lastMouseY = -100;

function updateMouseTrail() {
  if (mouseX < 0) return;
  const dx = mouseX - lastMouseX;
  const dy = mouseY - lastMouseY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 2) return;

  if (Math.random() < CONFIG.mouseTrailRate) {
    const p = getParticle();
    if (p) {
      p.reset(
        mouseX + rand(-3, 3), mouseY + rand(-3, 3),
        rand(-0.2, 0.2), rand(-0.2, 0.2),
        pick(['#FFF8E7', '#FFE4B5', '#E6E6FA']),
        CONFIG.mouseTrailLife,
        rand(0.6, 1.4)
      );
      p.type = 'mousetrail';
      p.glow = 6;
      p.friction = 0.95;
    }
  }
  lastMouseX = mouseX;
  lastMouseY = mouseY;
}

/* ========================================================================
   ★ 主循环
   ======================================================================== */

function animate() {
  if (isPaused) {
    animFrameId = requestAnimationFrame(animate);
    return;
  }

  frameCount++;

  // ---- 拖尾效果：半透明覆盖，创造柔和残影 ----
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgba(3, 4, 15, ${CONFIG.trailFadeAlpha})`;
  ctx.fillRect(0, 0, W, H);

  // ---- 星空 ----
  drawStars(ctx, frameCount);

  // ---- 自动烟花秀编排 ----
  showTimer++;
  if (showTimer >= CONFIG.showDuration) {
    // 一场秀结束，重新开始（随机性保证每场不同）
    showTimer = 0;
    nextFireworkFrame = frameCount + randInt(20, 40);
  }

  // 高潮段（秀的后40%）发射更密集
  const inFinale = showTimer > CONFIG.showDuration * CONFIG.finaleStart;
  const gap = inFinale
    ? CONFIG.showFireworkMinGap * CONFIG.finaleMultiplier
    : rand(CONFIG.showFireworkMinGap, CONFIG.showFireworkMaxGap);

  if (frameCount >= nextFireworkFrame) {
    spawnAutoFirework();
    nextFireworkFrame = frameCount + gap;
    // 高潮段偶尔双发
    if (inFinale && Math.random() < 0.4) {
      setTimeout(() => spawnAutoFirework(), 100);
    }
  }

  // ---- 花朵定时生成 ----
  flowerTimer++;
  if (flowerTimer >= CONFIG.flowerSpawnInterval) {
    flowerTimer = 0;
    spawnFlower();
  }

  // ---- 鼠标拖尾 ----
  updateMouseTrail();

  // ---- 加法混合绘制烟花（璀璨叠加效果）----
  ctx.globalCompositeOperation = 'lighter';

  // 更新并绘制烟花火箭
  for (const fw of fireworkPool) {
    fw.update(particlePool);
    fw.draw(ctx);
  }

  // 更新并绘制粒子
  for (const p of particlePool) {
    p.update();
    p.draw(ctx);
  }

  // 更新并绘制飘落花瓣
  for (const fp of petalPool) {
    fp.update();
    fp.draw(ctx);
  }

  // ---- 正常混合绘制花朵（不与烟花叠加）----
  ctx.globalCompositeOperation = 'source-over';
  for (const flower of flowerPool) {
    flower.update();
    flower.draw(ctx);
  }

  animFrameId = requestAnimationFrame(animate);
}

/* ========================================================================
   ★ 交互事件绑定
   ======================================================================== */

// 鼠标 / 触摸点击：在点击处绽放小型烟花 + 花瓣
function handleClick(e) {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
  const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
  spawnClickFirework(x, y);
}

canvas.addEventListener('click', handleClick);
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  handleClick(e);
}, { passive: false });

// 鼠标移动：记录位置用于星光拖尾
canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});
canvas.addEventListener('mouseleave', () => {
  mouseX = -100; mouseY = -100;
});

// 键盘：空格切换全屏，P 暂停/继续
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  } else if (e.code === 'KeyP') {
    isPaused = !isPaused;
    pauseIndicator.classList.toggle('show', isPaused);
  }
});

// 窗口大小变化
window.addEventListener('resize', resize);

/* ========================================================================
   ★ 启动
   ======================================================================== */

resize();
// 开场延迟一小会儿，让标题先浮现
setTimeout(() => {
  nextFireworkFrame = frameCount + 30;
  // 开场先绽放两朵花，营造静谧氛围
  spawnFlower();
  setTimeout(spawnFlower, 500);
  animate();
}, 800);

</script>
</body>
